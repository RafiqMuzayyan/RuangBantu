
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Tiket | RuangBantu</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="dashboard-navbar">
        <div class="nav-brand">
            <div class="brand-icon">R</div>
            <span>RuangBantu</span>
        </div>

        <nav class="nav-menu">
            <a href="{{ url_for('dashboard') }}" class="active">Dashboard</a>
            <a href="{{ url_for('my_tickets') }}">Tiket Saya</a>
        </nav>

        <div class="nav-account">
            <span>Pengguna</span>
            <a href="{{ url_for('logout') }}">Keluar</a>
        </div>
    </header>

    <main class="form-container">

        <div class="form-page-heading">
            <a href="{{ url_for('dashboard') }}" class="back-link">
                ← Kembali ke Dashboard
            </a>

            <h1>Buat Tiket Baru</h1>
            <p>Jelaskan kendala yang kamu alami agar dapat segera dibantu.</p>
        </div>

        <section class="ticket-form-card">           
            <form
                action="{% if ticket %}{{ url_for('edit_ticket', ticket_id=ticket.id) }}{% else %}{{ url_for('create_ticket') }}{% endif %}"
                method="POST"
            >
                <div class="form-group">
                    <label for="title">Judul Tiket</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Contoh: Tidak bisa login ke akun"
                        maxlength="100"
                        value="{{ ticket.title if ticket else '' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Kategori</label>
                    <select id="category" name="category" required>
                        <option value="" disabled {% if not ticket %}selected{% endif %}>
                            Pilih kategori
                        </option>

                        <option value="Technical"
                            {% if ticket and ticket.category == 'Technical' %}selected{% endif %}>
                            Technical
                        </option>

                        <option value="Account"
                            {% if ticket and ticket.category == 'Account' %}selected{% endif %}>
                            Account
                        </option>

                        <option value="General"
                            {% if ticket and ticket.category == 'General' %}selected{% endif %}>
                            General
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Detail Keluhan</label>
                    <textarea
                        id="description"
                        name="description"
                        rows="7"
                        placeholder="Jelaskan masalah yang kamu alami secara detail..."
                        required
                    >{{ ticket.description if ticket else '' }}</textarea>

                    <span class="input-hint">
                        Sertakan informasi yang membantu Admin memahami masalahmu.
                    </span>
                </div>

                <div class="form-actions">
                    <a href="{% if ticket %}{{ url_for('ticket_detail', ticket_id=ticket.id) }}{% else %}{{ url_for('dashboard') }}{% endif %}"
                    class="cancel-button">
                        Batal
                    </a>

                    <button type="submit" class="login-button">
                        {% if ticket %}Simpan Perubahan{% else %}Kirim Tiket{% endif %}
                    </button>
                </div>
            </form>
        </section>

    </main>

</body>
</html>
