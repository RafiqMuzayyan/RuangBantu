
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Tiket | RuangBantu</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="dashboard-navbar">
        <div class="nav-brand">
            <div class="brand-icon">R</div>
            <span>RuangBantu</span>
        </div>

        <nav class="nav-menu">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="#">Tiket Saya</a>
        </nav>

        <div class="nav-account">
            <span>Pengguna</span>
            <a href="{{ url_for('logout') }}">Keluar</a>
        </div>
    </header>

    <main class="form-container">

        <div class="form-page-heading">
            <a href="{{ url_for('dashboard') }}" class="back-link">
                ← Kembali ke Dashboard
            </a>

            <h1>Buat Tiket Baru</h1>
            <p>Jelaskan kendala yang kamu alami agar dapat segera dibantu.</p>
        </div>

        <section class="ticket-form-card">
            <form action="{{ url_for('create_ticket') }}" method="POST">

                <div class="form-group">
                    <label for="title">Judul Tiket</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Contoh: Tidak bisa login ke akun"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Kategori</label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>
                            Pilih kategori
                        </option>
                        <option value="Technical">Technical</option>
                        <option value="Account">Account</option>
                        <option value="General">General</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Detail Keluhan</label>
                    <textarea
                        id="description"
                        name="description"
                        rows="7"
                        placeholder="Jelaskan masalah yang kamu alami secara detail..."
                        required
                    ></textarea>
                    <span class="input-hint">
                        Sertakan informasi yang membantu Admin memahami masalahmu.
                    </span>
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('dashboard') }}"
                       class="cancel-button">Batal</a>

                    <button type="submit" class="login-button">
                        Kirim Tiket
                    </button>
                </div>

            </form>
        </section>

    </main>

</body>
</html>
